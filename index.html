<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 실시간 월급루팡 타이머 & 일기장</title>
  <style>
    /* 테마 정의 */
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --sub-text: #64748b;
      --accent: #2563eb;
      --money: #16a34a;
      --border: #e2e8f0;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.08);
    }

    [data-theme="milk-pastel"] {
      --bg: #fff5f7; --card-bg: #ffffff; --text: #2d3748; --sub-text: #a0aec0; --accent: #ff6b81; --money: #2ed573; --border: #ffe3e8; --shadow: 0 10px 25px -5px rgba(255,107,129,0.12);
    }
    [data-theme="soda-pop"] {
      --bg: #e0f2fe; --card-bg: #ffffff; --text: #0c4a6e; --sub-text: #0284c7; --accent: #0284c7; --money: #10b981; --border: #bae6fd; --shadow: 0 10px 25px -5px rgba(2,132,199,0.15);
    }
    [data-theme="sunshine"] {
      --bg: #fefce8; --card-bg: #ffffff; --text: #422006; --sub-text: #a16207; --accent: #eab308; --money: #16a34a; --border: #fef08a; --shadow: 0 10px 25px -5px rgba(234,179,8,0.15);
    }
    [data-theme="bubblegum"] {
      --bg: #fdf4ff; --card-bg: #ffffff; --text: #701a75; --sub-text: #c026d3; --accent: #d946ef; --money: #10b981; --border: #f5d0fe; --shadow: 0 10px 25px -5px rgba(217,70,239,0.15);
    }
    [data-theme="clean-neon"] {
      --bg: #111827; --card-bg: #1f2937; --text: #f9fafb; --sub-text: #9ca3af; --accent: #38bdf8; --money: #4ade80; --border: #374151; --shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
    }
    [data-theme="kuromi-punk"] {
      --bg: #181124; --card-bg: #261b36; --text: #f3e8ff; --sub-text: #c084fc; --accent: #c084fc; --money: #f472b6; --border: #3b2752; --shadow: 0 10px 25px -5px rgba(192,132,252,0.2);
    }
    [data-theme="emerald-city"] {
      --bg: #064e3b; --card-bg: #047857; --text: #ecfdf5; --sub-text: #a7f3d0; --accent: #34d399; --money: #facc15; --border: #059669; --shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
    }
    [data-theme="cyber-dark"] {
      --bg: #030712; --card-bg: #111827; --text: #f9fafb; --sub-text: #6b7280; --accent: #6366f1; --money: #22c55e; --border: #1f2937; --shadow: 0 10px 25px -5px rgba(0,0,0,0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px 12px; }
    .container { background: var(--card-bg); border-radius: 28px; padding: 32px 24px; width: 100%; max-width: 500px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    
    header { text-align: center; margin-bottom: 24px; }
    h1 { font-size: 1.4rem; font-weight: 800; margin-bottom: 6px; }
    .subtitle { font-size: 0.88rem; color: var(--sub-text); font-weight: 600; }

    .status-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; margin-top: 10px; background: rgba(0,0,0,0.05); }

    .main-box { background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 20px; text-align: center; margin-bottom: 20px; }
    .label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--sub-text); margin-bottom: 6px; font-weight: 700; }
    .amount { font-size: 2.8rem; font-weight: 900; color: var(--money); font-variant-numeric: tabular-nums; line-height: 1.2; }
    .time-sub { font-size: 1.1rem; font-weight: 700; color: var(--text); margin-top: 8px; font-variant-numeric: tabular-nums; }

    .progress-container { margin-bottom: 24px; }
    .progress-bar-bg { background: var(--border); height: 12px; border-radius: 6px; overflow: hidden; position: relative; }
    .progress-bar-fill { background: var(--accent); height: 100%; width: 0%; transition: width 0.3s ease; }
    .progress-labels { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--sub-text); margin-top: 6px; font-weight: 600; }

    /* 월루 실시간 모니터링 라이브 박스 */
    .rest-live-box {
      background: rgba(239, 68, 68, 0.08);
      border: 1px dashed #ef4444;
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      margin-bottom: 16px;
      display: none;
    }
    .rest-live-box.active { display: block; animation: pulse 2s infinite; }
    .rest-live-title { font-size: 0.8rem; color: #ef4444; font-weight: 800; margin-bottom: 8px; }
    .rest-title-input { width: 100%; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-weight: 700; text-align: center; font-size: 0.9rem; margin-bottom: 8px; }
    .rest-live-value { font-size: 1.4rem; font-weight: 900; color: var(--money); font-variant-numeric: tabular-nums; }
    .rest-live-time { font-size: 0.85rem; color: var(--sub-text); font-weight: 700; margin-top: 2px; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.2); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .actions { display: flex; gap: 10px; margin-bottom: 24px; }
    .btn { flex: 1; padding: 14px; border: none; border-radius: 14px; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: transform 0.1s; }
    .btn:active { transform: scale(0.98); }
    .btn-rest-start { background-color: var(--accent); color: #fff; }
    .btn-rest-end { background-color: #ef4444; color: #fff; }
    .btn-calendar { background-color: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 10px; font-size: 0.8rem; cursor: pointer; font-weight: 700; }

    .diary-section { border-top: 1px solid var(--border); padding-top: 20px; }
    .diary-header { font-size: 1rem; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .diary-list { max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .diary-item { background: var(--bg); border: 1px solid var(--border); padding: 10px 14px; border-radius: 12px; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; }
    .diary-item .text { font-weight: 600; color: var(--text); }
    .diary-item .earned { color: var(--money); font-weight: 700; }

    .settings-section { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 16px; font-size: 0.85rem; }
    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .setting-item label { display: block; font-size: 0.75rem; color: var(--sub-text); margin-bottom: 4px; font-weight: 600; }
    .setting-item input, .setting-item select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-weight: 600; }

    .btn-danger { width: 100%; margin-top: 12px; padding: 10px; background: #ef4444; color: #fff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.8rem; }

    /* 달력 모달 팝업 스타일 */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-card { background: var(--card-bg); border-radius: 20px; padding: 24px; width: 100%; max-width: 420px; border: 1px solid var(--border); box-shadow: var(--shadow); max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-title { font-weight: 800; font-size: 1.1rem; }
    .modal-close { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--sub-text); font-weight: 800; }
    
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; margin-bottom: 16px; }
    .calendar-day-head { font-size: 0.75rem; font-weight: 700; color: var(--sub-text); padding: 4px 0; }
    .calendar-cell { border-radius: 8px; padding: 6px 2px; min-height: 52px; font-size: 0.75rem; border: 1px solid var(--border); cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; background: var(--bg); }
    .calendar-cell.empty { border: none; background: transparent; cursor: default; }
    .calendar-cell .day-num { font-weight: 700; text-align: left; padding-left: 4px; }
    .calendar-cell .day-money { font-size: 0.65rem; color: var(--money); font-weight: 800; word-break: break-all; }
    .calendar-cell.selected { border: 2px solid var(--accent); }

    .day-details { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; }
    .day-details-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; color: var(--sub-text); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>2026 월급루팡 타이머</h1>
      <div class="subtitle" id="rateInfo">시급 10,320원 (초당 2.87원)</div>
      <div class="status-badge" id="statusBadge">상태 계산 중...</div>
    </header>

    <div class="main-box">
      <div class="label">오늘 지금까지 번 돈 💰</div>
      <div class="amount" id="earnedAmount">0 원</div>
      <div class="time-sub" id="currentTime">00:00:00</div>
    </div>

    <div class="progress-container">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="progress-labels">
        <span id="labelWorkStart">09:00</span>
        <span id="progressPercent">0%</span>
        <span id="labelWorkEnd">18:00</span>
      </div>
    </div>

    <!-- 실시간 월루 타이머 전용 감시 상자 -->
    <div class="rest-live-box" id="restLiveBox">
      <div class="rest-live-title">🚨 실시간 월급 루팡 중!</div>
      <input type="text" class="rest-title-input" id="restTitleInput" placeholder="오늘의 월루 제목을 입력하세요">
      <div class="rest-live-value" id="restLiveMoney">+0.00 원</div>
      <div class="rest-live-time" id="restLiveTime">휴식 시간: 00:00</div>
    </div>

    <div class="actions">
      <button class="btn btn-rest-start" id="restBtn" onclick="toggleRest()">☕ 월루(휴식) 시작</button>
    </div>

    <div class="diary-section">
      <div class="diary-header">
        <span>📖 오늘의 월루 일기장</span>
        <div style="display: flex; gap: 8px; align-items: center;">
          <span id="totalRestEarned" style="font-size: 0.8rem; color: var(--money); font-weight: 700;">총 0원</span>
          <button class="btn-calendar" onclick="openCalendarModal()">📅 월루 달력 보기</button>
        </div>
      </div>
      <div class="diary-list" id="diaryList">
        <div style="text-align: center; color: var(--sub-text); padding: 15px; font-size: 0.8rem;">아직 기록된 오늘자 월루 일기가 없습니다.</div>
      </div>
    </div>

    <div class="settings-section">
      <div style="font-weight: 700; margin-bottom: 6px;">⚙️ 시급, 근무 시간 & 저장 설정</div>
      <div class="settings-grid">
        <div class="setting-item" style="grid-column: span 2;">
          <label>기록 저장 방식</label>
          <select id="saveModeSelect" onchange="saveSettings()">
            <option value="session">창을 닫으면 삭제 (세션 저장)</option>
            <option value="local">항상 기록 (쿠키/브라우저 누적 저장)</option>
          </select>
        </div>
        <div class="setting-item" style="grid-column: span 2;">
          <label>시급 설정 (원)</label>
          <input type="number" id="hourlyRateInput" value="10320" min="0" step="10" onchange="saveSettings()">
        </div>
        <div class="setting-item">
          <label>출근 시간</label>
          <input type="time" id="workStartInput" value="09:00" onchange="saveSettings()">
        </div>
        <div class="setting-item">
          <label>퇴근 시간</label>
          <input type="time" id="workEndInput" value="18:00" onchange="saveSettings()">
        </div>
        <div class="setting-item">
          <label>점심 시작</label>
          <input type="time" id="lunchStartInput" value="12:00" onchange="saveSettings()">
        </div>
        <div class="setting-item">
          <label>점심 종료</label>
          <input type="time" id="lunchEndInput" value="13:00" onchange="saveSettings()">
        </div>
        <div class="setting-item" style="grid-column: span 2;">
          <label>색상 테마</label>
          <select id="themeSelect" onchange="changeTheme(this.value)">
            <option value="default">기본 클린 뷰</option>
            <option value="milk-pastel">밀크 파스텔 🍓</option>
            <option value="soda-pop">소다 팝 🥤</option>
            <option value="sunshine">썬샤인 옐로우 🍋</option>
            <option value="bubblegum">비비드 버블껌 🍬</option>
            <option value="clean-neon">클린 네온 🤍</option>
            <option value="kuromi-punk">쿠로미 펑크 🖤</option>
            <option value="emerald-city">에메랄드 시티 🌲</option>
            <option value="cyber-dark">딥 사이버 🌌</option>
          </select>
        </div>
      </div>
      <button class="btn-danger" onclick="clearAllData()">🗑️ 전체 월루 기록 초기화</button>
    </div>
  </div>

  <!-- 달력 팝업 모달 -->
  <div class="modal-overlay" id="calendarModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title" id="calendarMonthTitle">📅 2026년 월루 달력</div>
        <button class="modal-close" onclick="closeCalendarModal()">✕</button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
      <div class="day-details">
        <div class="day-details-title" id="selectedDateTitle">날짜를 클릭하면 세부 항목이 표시됩니다.</div>
        <div class="diary-list" id="modalDayDiaryList" style="max-height: 150px;"></div>
      </div>
    </div>
  </div>

  <script>
    let hourlyRate = 10320;
    let perSecondRate = hourlyRate / 3600;

    const LUPANG_QUOTES = [
      "화장실에서 스마트폰으로 득템 완료 🚽",
      "탕비실에서 믹스커피 타며 멍때리기 성공 ☕",
      "메일함 정리하는 척 딴짓하기 성공 💻",
      "동료와 긴급(잡담) 회의 완료 🗣️",
      "복사기 앞에서 파일 정독하는 척하기 📄",
      "물 마시러 가면서 사무실 한 바퀴 순찰 🚶",
      "건강을 위한 옥상 스트레칭 타임 🧘",
      "키보드 소리 크게 내며 엄청 바쁜 척하기 ⌨️",
      "퇴근 후 저녁 메뉴 심도 있게 고민 완료 🍕",
      "노트북 업데이트 핑계 대고 휴식 💻",
      "주말 여행 계획 구상 완료 ✈️",
      "의자 등받이 각도 테스트 완료 🪑",
      "듀얼 모니터에 뉴스창 작게 띄워보기 📰",
      "서류 봉투 들고 사옥 탐방 완료 📁",
      "창밖 날씨 감상하며 감성 충전 완료 🌤️",
      "다음 휴가 계획표 구체화 성공 🗓️",
      "단속 카메라 피하듯 눈치 보기 성공 👁️",
      "바탕화면 아이콘 정렬하며 시간 벌기 🖥️",
      "소화 시킬 겸 계단 걷기 운동 완료 🏃",
      "숨만 쉬고 있어도 돈이 쌓이는 중 💸"
    ];

    let isResting = false;
    let restStartTime = null;

    function getTodayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function getStorageObject() {
      const saveMode = document.getElementById('saveModeSelect')?.value || 'session';
      return saveMode === 'local' ? localStorage : sessionStorage;
    }

    function saveSettings() {
      const inputRate = parseFloat(document.getElementById('hourlyRateInput').value) || 10320;
      hourlyRate = inputRate;
      perSecondRate = hourlyRate / 3600;

      const saveMode = document.getElementById('saveModeSelect').value;

      const settings = {
        saveMode: saveMode,
        hRate: hourlyRate,
        wStart: document.getElementById('workStartInput').value,
        wEnd: document.getElementById('workEndInput').value,
        lStart: document.getElementById('lunchStartInput').value,
        lEnd: document.getElementById('lunchEndInput').value,
        theme: document.getElementById('themeSelect').value
      };
      
      // 설정을 저장
      localStorage.setItem('lupang_settings', JSON.stringify(settings));
      updateDisplay();
    }

    function loadSettings() {
      const saved = localStorage.getItem('lupang_settings');
      if (saved) {
        const s = JSON.parse(saved);
        if (s.saveMode) document.getElementById('saveModeSelect').value = s.saveMode;
        if (s.hRate) {
          hourlyRate = parseFloat(s.hRate);
          document.getElementById('hourlyRateInput').value = hourlyRate;
        }
        document.getElementById('workStartInput').value = s.wStart || "09:00";
        document.getElementById('workEndInput').value = s.wEnd || "18:00";
        document.getElementById('lunchStartInput').value = s.lStart || "12:00";
        document.getElementById('lunchEndInput').value = s.lEnd || "13:00";
        if (s.theme) {
          document.getElementById('themeSelect').value = s.theme;
          changeTheme(s.theme);
        }
      }
      perSecondRate = hourlyRate / 3600;
      renderTodayDiary();
    }

    function changeTheme(theme) {
      if (theme === 'default') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', theme);
      }
      saveSettings();
    }

    function getSecondsFromTimeStr(str) {
      const [h, m] = str.split(':').map(Number);
      return h * 3600 + m * 60;
    }

    function toggleRest() {
      const btn = document.getElementById('restBtn');
      const liveBox = document.getElementById('restLiveBox');
      const titleInput = document.getElementById('restTitleInput');

      if (!isResting) {
        isResting = true;
        restStartTime = new Date();
        btn.textContent = "🛑 월루(휴식) 종료 & 일기 작성";
        btn.className = "btn btn-rest-end";
        liveBox.classList.add('active');

        // 랜덤 제목 자동입력
        const randomQuote = LUPANG_QUOTES[Math.floor(Math.random() * LUPANG_QUOTES.length)];
        titleInput.value = randomQuote;
      } else {
        const restEndTime = new Date();
        const earnedPaidSeconds = calculatePaidSecondsBetween(restStartTime, restEndTime);
        const earned = earnedPaidSeconds * perSecondRate;
        const customTitle = titleInput.value.trim() || "월급루팡 활동 완료 ☕";
        
        addDiaryEntry(earned, customTitle);
        
        isResting = false;
        restStartTime = null;
        btn.textContent = "☕ 월루(휴식) 시작";
        btn.className = "btn btn-rest-start";
        liveBox.classList.remove('active');
      }
    }

    function calculatePaidSecondsBetween(startDate, endDate) {
      const lStartSec = getSecondsFromTimeStr(document.getElementById('lunchStartInput').value);
      const lEndSec = getSecondsFromTimeStr(document.getElementById('lunchEndInput').value);

      const startSec = startDate.getHours() * 3600 + startDate.getMinutes() * 60 + startDate.getSeconds();
      const endSec = endDate.getHours() * 3600 + endDate.getMinutes() * 60 + endDate.getSeconds();

      if (endSec <= startSec) return 0;

      const overlapStart = Math.max(startSec, lStartSec);
      const overlapEnd = Math.min(endSec, lEndSec);
      const lunchOverlapSec = Math.max(0, overlapEnd - overlapStart);

      const totalDiffSec = (endDate - startDate) / 1000;
      return Math.max(0, totalDiffSec - lunchOverlapSec);
    }

    function addDiaryEntry(earned, title) {
      const storage = getStorageObject();
      const todayKey = getTodayKey();

      let diaryData = JSON.parse(storage.getItem('lupang_diary_data') || '{}');
      if (!diaryData[todayKey]) {
        diaryData[todayKey] = [];
      }

      diaryData[todayKey].unshift({
        title: title,
        earned: earned,
        time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
      });

      storage.setItem('lupang_diary_data', JSON.stringify(diaryData));
      renderTodayDiary();
    }

    function renderTodayDiary() {
      const storage = getStorageObject();
      const todayKey = getTodayKey();
      const diaryData = JSON.parse(storage.getItem('lupang_diary_data') || '{}');
      const todayList = diaryData[todayKey] || [];

      const diaryListEl = document.getElementById('diaryList');
      let totalEarned = 0;

      if (todayList.length === 0) {
        diaryListEl.innerHTML = '<div style="text-align: center; color: var(--sub-text); padding: 15px; font-size: 0.8rem;">아직 기록된 오늘자 월루 일기가 없습니다.</div>';
      } else {
        diaryListEl.innerHTML = todayList.map(item => {
          totalEarned += item.earned;
          return `
            <div class="diary-item">
              <span class="text">${item.title}</span>
              <span class="earned">+${item.earned.toLocaleString('ko-KR', {minimumFractionDigits: 1, maximumFractionDigits: 1})}원</span>
            </div>
          `;
        }).join('');
      }

      document.getElementById('totalRestEarned').textContent = `오늘 총 ${totalEarned.toLocaleString('ko-KR', {maximumFractionDigits: 0})}원`;
    }

    function clearAllData() {
      if (confirm("🚨 경고: 저장된 모든 일자의 월급루팡 기록이 영구적으로 삭제됩니다.\n정말 초기화하시겠습니까?")) {
        localStorage.removeItem('lupang_diary_data');
        sessionStorage.removeItem('lupang_diary_data');
        renderTodayDiary();
        alert("모든 루팡 기록이 초기화되었습니다.");
      }
    }

    /* 달력 모달 관련 */
    function openCalendarModal() {
      document.getElementById('calendarModal').classList.add('active');
      renderCalendar();
    }

    function closeCalendarModal() {
      document.getElementById('calendarModal').classList.remove('active');
    }

    function renderCalendar() {
      const storage = getStorageObject();
      const diaryData = JSON.parse(storage.getItem('lupang_diary_data') || '{}');

      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();

      document.getElementById('calendarMonthTitle').textContent = `📅 ${year}년 ${month + 1}월 월루 달력`;

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const daysOfWeek = ['일', '월', '화', '수', '목', '금', '토'];
      daysOfWeek.forEach(d => {
        grid.innerHTML += `<div class="calendar-day-head">${d}</div>`;
      });

      for (let i = 0; i < firstDay; i++) {
        grid.innerHTML += `<div class="calendar-cell empty"></div>`;
      }

      for (let date = 1; date <= lastDate; date++) {
        const dateKey = `${year}-${String(month+1).padStart(2,'0')}-${String(date).padStart(2,'0')}`;
        const dayEntries = diaryData[dateKey] || [];
        const dayTotal = dayEntries.reduce((sum, item) => sum + item.earned, 0);

        const cell = document.createElement('div');
        cell.className = 'calendar-cell';
        cell.onclick = () => selectCalendarDate(dateKey, dayEntries);

        cell.innerHTML = `
          <div class="day-num">${date}</div>
          ${dayTotal > 0 ? `<div class="day-money">+${Math.floor(dayTotal).toLocaleString()}</div>` : ''}
        `;
        grid.appendChild(cell);
      }
    }

    function selectCalendarDate(dateKey, entries) {
      document.getElementById('selectedDateTitle').textContent = `📌 ${dateKey} 루팡 세부 내역`;
      const listEl = document.getElementById('modalDayDiaryList');

      if (entries.length === 0) {
        listEl.innerHTML = '<div style="text-align: center; color: var(--sub-text); padding: 10px; font-size: 0.8rem;">기록된 월루 내역이 없습니다.</div>';
      } else {
        listEl.innerHTML = entries.map(item => `
          <div class="diary-item">
            <span class="text">${item.title}</span>
            <span class="earned">+${item.earned.toLocaleString('ko-KR', {minimumFractionDigits: 1, maximumFractionDigits: 1})}원</span>
          </div>
        `).join('');
      }
    }

    function updateDisplay() {
      const now = new Date();
      const currentSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds() + (now.getMilliseconds() / 1000);

      const wStartSec = getSecondsFromTimeStr(document.getElementById('workStartInput').value);
      const wEndSec = getSecondsFromTimeStr(document.getElementById('workEndInput').value);
      const lStartSec = getSecondsFromTimeStr(document.getElementById('lunchStartInput').value);
      const lEndSec = getSecondsFromTimeStr(document.getElementById('lunchEndInput').value);

      document.getElementById('rateInfo').textContent = `시급 ${hourlyRate.toLocaleString('ko-KR')}원 (초당 ${(perSecondRate).toFixed(2)}원)`;
      document.getElementById('labelWorkStart').textContent = document.getElementById('workStartInput').value;
      document.getElementById('labelWorkEnd').textContent = document.getElementById('workEndInput').value;

      const pad = n => String(n).padStart(2, '0');
      document.getElementById('currentTime').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

      let activeWorkSeconds = 0;
      let badgeText = "";

      if (currentSec < wStartSec) {
        activeWorkSeconds = 0;
        badgeText = "💤 출근 전 (대기 중)";
      } else if (currentSec >= wEndSec) {
        const totalLunch = Math.max(0, lEndSec - lStartSec);
        activeWorkSeconds = (wEndSec - wStartSec) - totalLunch;
        badgeText = "🎉 칼퇴 성공! 수고하셨습니다";
      } else {
        if (currentSec >= lStartSec && currentSec < lEndSec) {
          activeWorkSeconds = lStartSec - wStartSec;
          badgeText = "☕ 점심/휴게 시간 (금액 동결)";
        } else if (currentSec > lEndSec) {
          const totalLunch = lEndSec - lStartSec;
          activeWorkSeconds = (currentSec - wStartSec) - totalLunch;
          badgeText = "🔥 실시간 월급 버는 중!";
        } else {
          activeWorkSeconds = currentSec - wStartSec;
          badgeText = "🔥 실시간 월급 버는 중!";
        }
      }

      const totalWorkDuration = (wEndSec - wStartSec) - Math.max(0, lEndSec - lStartSec);
      const progressRatio = Math.min(100, Math.max(0, (activeWorkSeconds / totalWorkDuration) * 100));
      const totalEarned = activeWorkSeconds * perSecondRate;

      document.getElementById('earnedAmount').textContent = `${totalEarned.toLocaleString('ko-KR', {minimumFractionDigits: 2, maximumFractionDigits: 2})} 원`;
      document.getElementById('progressFill').style.width = `${progressRatio.toFixed(1)}%`;
      document.getElementById('progressPercent').textContent = `${progressRatio.toFixed(1)}%`;
      document.getElementById('statusBadge').textContent = badgeText;

      // 월루(휴식) 실시간 갱신
      if (isResting && restStartTime) {
        const restPaidSec = calculatePaidSecondsBetween(restStartTime, now);
        const restEarned = restPaidSec * perSecondRate;

        const totalRestSec = Math.floor((now - restStartTime) / 1000);
        const rMin = pad(Math.floor(totalRestSec / 60));
        const rSec = pad(totalRestSec % 60);

        document.getElementById('restLiveMoney').textContent = `+${restEarned.toLocaleString('ko-KR', {minimumFractionDigits: 2, maximumFractionDigits: 2})} 원`;
        document.getElementById('restLiveTime').textContent = `휴식 시간: ${rMin}:${rSec}`;
      }
    }

    loadSettings();
    setInterval(updateDisplay, 50);
  </script>
</body>
</html>
